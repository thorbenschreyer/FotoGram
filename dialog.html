<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">

<body class="test">

    <div class="dialog">

        <div class="dialog-wrapper">


            <header class="dialog-haeder">
                <h2>Image Name</h2>
                <img src="./img/close_icon.png" alt="Icon zum Schließen des Dialogs">
            </header>

            <section class="dialog-section">
                <img src="./img/photo_album/img_1.jpg" alt="Photo aus der Bibliothek">
            </section>

            <footer class="dialog-footer">
                <button class="dialog-button"><img src="./img/arrow_left.png" alt="Nach link/kleiner bewegen"></button>
                <p> 1 / 2</p>
                <button class="dialog-button"><img src="./img/aarrow_right.png" alt="Nach rechts/größer bewegen"></button>
            </footer>

        </div>
    </div>










</body>
