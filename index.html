<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&display=swap"
        rel="stylesheet">
    <link rel="icon" href="./img/favicon_fotogram.png" type="img/png">
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
    <title>Fotogram</title>
</head>

<body>
    <header class="main-header">
        <div class="header-img wrapper">
            <img src="./img/fotogram_logo.png" alt="Logo von Fotogram">
        </div>

    </header>

    <section class="wrapper photo-album-section">
        <p class="photo-album-section-p">Your personal photo album</p>

        <div class="thumbnail-section">
            <div onclick="openDialog()" class="thumbnail-img">
                <img src="./img/photo_album/img_1.jpg" alt="Bild von Bergen und Seen in Alaska">
            </div>
            <div class="thumbnail-img">
                <img src="./img/photo_album/img_1.jpg" alt="Bild von Bergen und Seen in Alaska">
            </div>
            <div class="thumbnail-img">
                <img src="./img/photo_album/img_1.jpg" alt="Bild von Bergen und Seen in Alaska">
            </div>
            <div class="thumbnail-img">
                <img src="./img/photo_album/img_1.jpg" alt="Bild von Bergen und Seen in Alaska">
            </div>
            <div class="thumbnail-img">
                <img src="./img/photo_album/img_1.jpg" alt="Bild von Bergen und Seen in Alaska">
            </div>
            <div class="thumbnail-img">
                <img src="./img/photo_album/img_1.jpg" alt="Bild von Bergen und Seen in Alaska">
            </div>
            <div class="thumbnail-img">
                <img src="./img/photo_album/img_1.jpg" alt="Bild von Bergen und Seen in Alaska">
            </div>
            <div class="thumbnail-img">
                <img src="./img/photo_album/img_1.jpg" alt="Bild von Bergen und Seen in Alaska">
            </div>
            <div class="thumbnail-img">
                <img src="./img/photo_album/img_1.jpg" alt="Bild von Bergen und Seen in Alaska">
            </div>
            <div class="thumbnail-img">
                <img src="./img/photo_album/img_1.jpg" alt="Bild von Bergen und Seen in Alaska">
            </div>
            <div class="thumbnail-img">
                <img src="./img/photo_album/img_1.jpg" alt="Bild von Bergen und Seen in Alaska">
            </div>
            <div class="thumbnail-img">
                <img src="./img/photo_album/img_1.jpg" alt="Bild von Bergen und Seen in Alaska">
            </div>
        </div>
        <dialog id="image-present-dialog">
            <div class="dialog-style">
                <div class="dialog-wrapper">
                    <header class="dialog-haeder">
                        <h2>Image Name</h2>
                        <button onclick="closeDialog()" class="close-btn"><img src="./img/close_icon.png"
                                alt="Icon zum Schließen des Dialogs"></button>
                    </header>

                    <section class="dialog-section">
                        <img src="./img/photo_album/img_1.jpg" alt="Photo aus der Bibliothek">
                    </section>

                    <footer class="dialog-footer">
                        <button class="dialog-forward-button"><img src="./img/arrow_left.png"
                                alt="Nach link/kleiner bewegen"></button>
                        <p class="img-number"> 1 / 2</p>
                        <button class="dialog-forward-button"><img src="./img/aarrow_right.png"
                                alt="Nach rechts/größer bewegen"></button>
                    </footer>

                </div>
            </div>
        </dialog>
    </section>

    <footer class="main-footer">
        <img src="./img/devloper_akademie_logo.png" alt="Logo der Devloper Akademie">
        <p>&copy; 2026 Thorben Schreyer</p>
    </footer>



</body>

</html>
