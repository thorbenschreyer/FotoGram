<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&display=swap"
        rel="stylesheet">
    <link rel="icon" href="./img/favicon_fotogram.png" type="img/png">
    <link rel="stylesheet" href="style.css">
    <title>Fotogram</title>
</head>
<!-- load() loads the images on the page -->

<body onload="load()">
    <header class="main-header">
        <div class="header-img wrapper">
            <img src="./img/fotogram_logo.png" alt="Logo von Fotogram">
        </div>

    </header>

    <section class="wrapper photo-album-section">
        <h1 class="photo-album-section-h1">Your personal photo album</h1>
        <div class="thumbnail-section" id="thumbnail-section">
            
        </div>

        <dialog id="dialog" aria-labelledby="image-name">
                <div class="dialog-style">
                    <div class="dialog-wrapper">
                        <header class="dialog-haeder">
                            <h2 id="image-name">Image Name</h2>
                            <button aria-label="Schließen" onclick="closeDialog()" class="close-btn"><img
                                    src="./img/close_icon.png" alt="Icon zum Schließen des Dialogs"></button>
                        </header>

                        <section class="dialog-section" id="dialog-section">
                            <!-- Images are created here by DOM -->
                        </section>

                        <footer class="dialog-footer">
                            <button aria-label="Vorheriges Bild" onclick="lastImg()" class="dialog-forward-button"><img
                                    src="./img/arrow_left.png" alt="Nach link/kleiner bewegen"></button>
                            <p class="img-number" id="img-number"> 1 / 2</p>
                            <button aria-label="Nächstes Bild" onclick="nextImg()" class="dialog-forward-button"><img
                                    src="./img/aarrow_right.png" alt="Nach rechts/größer bewegen"></button>
                        </footer>
                    </div>
                </div>
            </dialog>
            
    </section>
    <footer class="main-footer">
        <img src="./img/devloper_akademie_logo.png" alt="Logo der Devloper Akademie">
        <p>&copy; 2026 Thorben Schreyer</p>
    </footer>
</body>
<script src="script.js"></script>

</html>
